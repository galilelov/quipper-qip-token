<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Math Blitz Pro</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            margin: 0; padding: 0; background: #1a1a2e; color: white; 
            display: flex; justify-content: center; 
            height: 100vh; height: 100dvh; overflow: hidden; 
        }

        #game-container { 
            width: 100%; max-width: 400px; height: 100%; 
            padding: env(safe-area-inset-top, 10px) 15px env(safe-area-inset-bottom, 15px) 15px;
            display: flex; flex-direction: column; justify-content: space-between; 
        }
        
        #status-bar { display: flex; justify-content: space-between; font-size: 18px; font-weight: bold; color: #00d2ff; }
        #set-info { text-align: center; color: #e94560; font-size: 12px; margin-top: 2px; text-transform: uppercase; }
        
        #question-box { 
            flex: 1; min-height: 80px; max-height: 120px; margin: 10px 0;
            background: rgba(255,255,255,0.05); border-radius: 15px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            text-align: center; font-size: 26px; font-weight: bold; padding: 10px;
            border: 1px solid rgba(255,255,255,0.1); 
        }
        
        #timer-area { width: 100%; height: 4px; background: #333; border-radius: 2px; margin-bottom: 10px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: #e94560; }

        #grid, #bonus-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
        
        .cell { 
            aspect-ratio: 1.2 / 1; background: #16213e; border: none; color: white; 
            font-size: 30px; font-weight: bold; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 0 #0f3460;
        }
        .cell:active { transform: translateY(2px); box-shadow: 0 2px 0 #0f3460; }
        
        .comp-btn { font-size: 32px; color: #e94560; border: 2px solid #e94560; background: transparent; border-radius: 50%; box-shadow: none; }
        .correct { background: #2ecc71 !important; box-shadow: 0 4px 0 #27ae60 !important; }
        .wrong { background: #e74c3c !important; box-shadow: 0 4px 0 #c0392b !important; }

        #start-btn { 
            width: 100%; padding: 20px; font-size: 22px; font-weight: bold; 
            background: #e94560; color: white; border: none; border-radius: 15px; 
            display: none; box-shadow: 0 5px 0 #a02d40; text-transform: uppercase;
        }
        
        .combo-dots { display: flex; justify-content: center; gap: 5px; margin-top: 5px; }
        .dot { width: 8px; height: 8px; background: #333; border-radius: 50%; }
        .dot.active { background: #00d2ff; box-shadow: 0 0 8px #00d2ff; }
        .bonus-q-container { display: flex; align-items: center; justify-content: center; gap: 15px; width: 100%; }
        .bonus-q-side { font-size: 22px; color: white; flex: 1; }
        .q-mark { 
            font-size: 40px; color: #e94560; font-weight: 900; 
            text-shadow: 0 0 15px rgba(233, 69, 96, 0.5); 
            animation: pulse 1.5s infinite; 
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-bar">
        <span>💰 <b id="tokens">0</b></span>
        <span>❤️ <b id="lives">12</b></span>
    </div>
    
    <div id="set-info">
        SET: <span id="progress">0</span> / 9 
        <div id="combo" class="combo-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>

    <div id="question-box">LOADING...</div>
    
    <div id="timer-area"><div id="timer-bar"></div></div>

    <div id="grid">
        <button class="cell" onclick="makeMove(1)">1</button>
        <button class="cell" onclick="makeMove(2)">2</button>
        <button class="cell" onclick="makeMove(3)">3</button>
        <button class="cell" onclick="makeMove(4)">4</button>
        <button class="cell" onclick="makeMove(5)">5</button>
        <button class="cell" onclick="makeMove(6)">6</button>
        <button class="cell" onclick="makeMove(7)">7</button>
        <button class="cell" onclick="makeMove(8)">8</button>
        <button class="cell" onclick="makeMove(9)">9</button>
    </div>

    <div id="bonus-grid">
        <button class="cell comp-btn" onclick="makeBonusMove('<')">&lt;</button>
        <button class="cell comp-btn" onclick="makeBonusMove('=')">=</button>
        <button class="cell comp-btn" onclick="makeBonusMove('>')">&gt;</button>
    </div>

    <button id="start-btn" onclick="startNewSet()">START SET</button>
</div>

<script>
    let tokens = 0, lives = 12, setProgress = 0, combo = 0, currentQuestionIndex = 0;
    let currentAnswer, timer, canClick = false, isBonus = false, bonusStep = 0, bonusAnswer = '';
    let allQuestions = [];

    async function init() {
        const qBox = document.getElementById('question-box');
        try {
            const res = await fetch('questions.json?v=' + Date.now());
            if (!res.ok) throw new Error(`Error ${res.status}`);
            allQuestions = await res.json();
            qBox.innerText = "READY";
            document.getElementById('start-btn').style.display = 'block';
        } catch (e) {
            qBox.innerHTML = `<span style="color:#ff4757; font-size:14px;">LOAD ERROR</span>`;
        }
    }

    function startNewSet() {
        setProgress = 0; lives = 12; combo = 0; isBonus = false;
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('grid').style.display = 'grid';
        document.getElementById('bonus-grid').style.display = 'none';
        updateUI();
        nextQuestion();
    }

    function nextQuestion() {
        if (setProgress >= 9) { startBonusRound(); return; }
        canClick = false; resetStyles();
        const q = allQuestions[currentQuestionIndex];
        currentAnswer = q.a;
        document.getElementById('question-box').innerText = q.q;
        startTimer(q.t);
        setTimeout(() => { canClick = true; }, 100);
    }

    function makeMove(num) {
        if (!canClick) return;
        if (num === currentAnswer) {
            clearInterval(timer); canClick = false;
            tokens += 10; combo++; setProgress++;
            if (combo === 3) { tokens += 30; combo = 0; }
            document.querySelectorAll('#grid .cell')[num-1].classList.add('correct');
            currentQuestionIndex = (currentQuestionIndex + 1) % allQuestions.length;
            updateUI();
            setTimeout(nextQuestion, 300);
        } else {
            tokens = Math.max(0, tokens - 1); lives--; combo = 0;
            document.querySelectorAll('#grid .cell')[num-1].classList.add('wrong');
            updateUI();
            if (lives <= 0) gameOver("GAME OVER");
        }
    }

    function startBonusRound() {
        isBonus = true; bonusStep = 0;
        document.getElementById('grid').style.display = 'none';
        document.getElementById('bonus-grid').style.display = 'grid';
        nextBonusTask();
    }

    function nextBonusTask() {
    if (bonusStep >= 3) {
        tokens += 1000;
        updateUI();
        alert("CONGRATULATIONS! +1000 TOKENS");
        startNewSet();
        return;
    }

    // Фильтруем базу: берем только Easy (3000ms) и только короткие (менее 8 символов)
    const simpleQuestions = allQuestions.filter(item => item.t === 3000 && item.q.length < 8);
    
    // Если по какой-то причине база пуста, берем просто случайные
    const source = simpleQuestions.length > 10 ? simpleQuestions : allQuestions;
    
    const qA = source[Math.floor(Math.random() * source.length)];
    const qB = source[Math.floor(Math.random() * source.length)];

    // Определяем правильный ответ
    if (qA.a < qB.a) bonusAnswer = '<';
    else if (qA.a > qB.a) bonusAnswer = '>';
    else bonusAnswer = '=';

    // Вывод на экран с выделенным знаком вопроса
    document.getElementById('question-box').innerHTML = `
        <div style="font-size:12px; color:#aaa; margin-bottom:5px; text-transform:uppercase;">Bonus Round ${bonusStep+1}/3</div>
        <div class="bonus-q-container">
            <div class="bonus-q-side">${qA.q}</div>
            <div class="q-mark">?</div>
            <div class="bonus-q-side">${qB.q}</div>
        </div>
    `;
    
    startTimer(9000); // 9 секунд на раздумья
    canClick = true;
}
    function makeBonusMove(sym) {
        if (!canClick) return;
        if (sym === bonusAnswer) { clearInterval(timer); bonusStep++; nextBonusTask(); }
        else { alert("BONUS LOST"); startNewSet(); }
    }

    function startTimer(duration) {
        clearInterval(timer);
        const bar = document.getElementById('timer-bar');
        bar.style.transition = 'none'; bar.style.width = '100%';
        setTimeout(() => { bar.style.transition = `width ${duration}ms linear`; bar.style.width = '0%'; }, 50);
        timer = setTimeout(() => {
            if (isBonus) { alert("TIME IS UP!"); startNewSet(); }
            else { 
                lives--; updateUI(); 
                if (lives <= 0) gameOver("OUT OF TIME"); 
                else nextQuestion(); 
            }
        }, duration);
    }

    function updateUI() {
        document.getElementById('tokens').innerText = tokens;
        document.getElementById('lives').innerText = lives;
        document.getElementById('progress').innerText = setProgress;
        document.querySelectorAll('.dot').forEach((d, i) => d.className = i < combo ? 'dot active' : 'dot');
    }

    function gameOver(txt) {
        clearInterval(timer); canClick = false;
        document.getElementById('grid').style.display = 'none';
        document.getElementById('bonus-grid').style.display = 'none';
        document.getElementById('question-box').innerText = txt;
        document.getElementById('start-btn').style.display = 'block';
        document.getElementById('start-btn').innerText = "TRY AGAIN";
    }

    function resetStyles() {
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('correct', 'wrong'));
    }

    init();
</script>
</body>
</html>
