            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            align-items: stretch;
        }

        #set-info { text-align: center; color: #e94560; font-size: 13px; }
        
        #question-box { 
            flex: 1; /* Растягивается, заполняя свободное место */
            min-height: 80px; 
            max-height: 140px;
            margin: 10px 0;
            background: rgba(255,255,255,0.05); 
            border-radius: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            font-size: 26px; 
            font-weight: bold; 
            border: 1px solid rgba(255,255,255,0.1); 
        }
        
        .bonus-q { font-size: 18px; color: #00d2ff; margin-top: 8px; }

        #timer-area { width: 100%; height: 6px; margin-bottom: 10px; }
        #timer-container { width: 100%; height: 100%; background: #333; border-radius: 3px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: #e94560; width: 100%; }

        #grid, #bonus-grid { 
            display: none; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px;
            margin-bottom: 5px;
        }
        
        .cell { 
            aspect-ratio: 1 / 1; 
            background: #16213e; 
            border: none;
            color: white; 
            font-size: 32px; 
            font-weight: bold; 
            border-radius: 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: 0.1s; 
            box-shadow: 0 4px 0 #0f3460;
        }
        .cell:active { transform: translateY(3px); box-shadow: 0 1px 0 #0f3460; background: #0f3460; }
        
        .comp-btn { font-size: 36px; color: #e94560; border: 2px solid #e94560; background: transparent; border-radius: 50%; box-shadow: none; }
        .comp-btn:active { transform: scale(0.9); box-shadow: none; }
        
        .correct { background: #2ecc71 !important; box-shadow: 0 4px 0 #27ae60 !important; }
        .wrong { background: #e74c3c !important; box-shadow: 0 4px 0 #c0392b !important; }

        #start-btn { 
            width: 100%; 
            padding: 22px; 
            font-size: 24px; 
            font-weight: bold; 
            background: #e94560; 
            color: white; 
            border: none; 
            border-radius: 20px; 
            cursor: pointer; 
            display: none;
            box-shadow: 0 6px 0 #a02d40;
        }
        #start-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #a02d40; }
        
        .combo-dots { display: flex; justify-content: center; gap: 8px; margin-top: 5px; }
        .dot { width: 10px; height: 10px; background: #333; border-radius: 50%; transition: 0.3s; }
        .dot.active { background: #00d2ff; box-shadow: 0 0 10px #00d2ff; }
    </style>
</head>

<body>

<div id="game-container">
    <div id="status-bar">
        <span>💰 <b id="tokens">0</b></span>
        <span>❤️ <b id="lives">18</b></span>
    </div>
    
    <div id="set-info">
        СЕТ: <span id="progress">0</span> / 9 
        <div id="combo" class="combo-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
    </div>

    <div id="question-box">ЗАГРУЗКА...</div>
    
    <div id="timer-area">
        <div id="timer-container"><div id="timer-bar"></div></div>
    </div>

    <div id="grid">
        <button class="cell" onclick="makeMove(1)">1</button>
        <button class="cell" onclick="makeMove(2)">2</button>
        <button class="cell" onclick="makeMove(3)">3</button>
        <button class="cell" onclick="makeMove(4)">4</button>
        <button class="cell" onclick="makeMove(5)">5</button>
        <button class="cell" onclick="makeMove(6)">6</button>
        <button class="cell" onclick="makeMove(7)">7</button>
        <button class="cell" onclick="makeMove(8)">8</button>
        <button class="cell" onclick="makeMove(9)">9</button>
    </div>

    <div id="bonus-grid">
        <button class="cell comp-btn" onclick="makeBonusMove('<')">&lt;</button>
        <button class="cell comp-btn" onclick="makeBonusMove('=')">=</button>
        <button class="cell comp-btn" onclick="makeBonusMove('>')">&gt;</button>
    </div>

    <button id="start-btn" onclick="startNewSet()">НАЧАТЬ СЕТ</button>
</div>

<script>
    let tokens = 0, lives = 18, setProgress = 0, combo = 0;
    let currentQuestionIndex = 0;
    let currentAnswer, timer, canClick = false, isBonus = false, bonusStep = 0, bonusAnswer = '';
    let allQuestions = [];

    async function init() {
        try {
            const res = await fetch('questions.json?v=' + Date.now());
            allQuestions = await res.json();
            document.getElementById('question-box').innerText = "БАЗА ГОТОВА";
            document.getElementById('start-btn').style.display = 'block';
        } catch (e) {
            document.getElementById('question-box').innerText = "ОШИБКА JSON";
        }
    }

    function startNewSet() {
        setProgress = 0;
        lives = 18;
        combo = 0;
        isBonus = false;
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('grid').style.display = 'grid';
        document.getElementById('bonus-grid').style.display = 'none';
        updateUI();
        nextQuestion();
    }

    function nextQuestion() {
        if (setProgress >= 9) { startBonusRound(); return; }
        canClick = false;
        resetStyles();
        const q = allQuestions[currentQuestionIndex];
        currentAnswer = q.a;
        document.getElementById('question-box').innerText = q.q;
        startTimer(q.t);
        setTimeout(() => { canClick = true; }, 150);
    }

    function makeMove(num) {
        if (!canClick) return;
        if (num === currentAnswer) {
            clearInterval(timer);
            canClick = false;
            tokens += 10;
            combo++;
            setProgress++;
            if (combo === 3) { tokens += 30; combo = 0; }
            document.querySelectorAll('#grid .cell')[num-1].classList.add('correct');
            currentQuestionIndex++;
            if (currentQuestionIndex >= allQuestions.length) currentQuestionIndex = 0;
            updateUI();
            setTimeout(nextQuestion, 400);
        } else {
            tokens = Math.max(0, tokens - 1);
            lives--;
            combo = 0;
            document.querySelectorAll('#grid .cell')[num-1].classList.add('wrong');
            updateUI();
            if (lives <= 0) gameOver("КОНЕЦ ИГРЫ");
        }
    }

    function startBonusRound() {
        isBonus = true;
        bonusStep = 0;
        document.getElementById('grid').style.display = 'none';
        document.getElementById('bonus-grid').style.display = 'grid';
        nextBonusTask();
    }

    function nextBonusTask() {
        if (bonusStep >= 3) {
            tokens += 1000;
            updateUI();
            alert("БОНУС +1000 ТОКЕНОВ!");
            startNewSet();
            return;
        }
        const qA = allQuestions[Math.floor(Math.random() * 500)]; 
        const qB = allQuestions[allQuestions.length - 1 - Math.floor(Math.random() * 500)];
        bonusAnswer = qA.a < qB.a ? '<' : (qA.a > qB.a ? '>' : '=');
        document.getElementById('question-box').innerHTML = `
            <div style="font-size:14px; color:#aaa">БОНУСНЫЙ ТУР ${bonusStep+1}/3</div>
            <div class="bonus-q">${qA.q} <span style="color:#e94560">?</span> ${qB.q}</div>
        `;
        startTimer(9000);
        canClick = true;
    }

    function makeBonusMove(sym) {
        if (!canClick) return;
        if (sym === bonusAnswer) {
            clearInterval(timer);
            bonusStep++;
            nextBonusTask();
        } else {
            alert("БОНУС ПОТЕРЯН");
            startNewSet();
        }
    }

    function startTimer(duration) {
        clearInterval(timer);
        const bar = document.getElementById('timer-bar');
        bar.style.transition = 'none'; bar.style.width = '100%';
        setTimeout(() => {
            bar.style.transition = `width ${duration}ms linear`;
            bar.style.width = '0%';
        }, 50);
        timer = setTimeout(() => {
            if (isBonus) startNewSet();
            else {
                lives--;
                updateUI();
                if (lives <= 0) gameOver("ВРЕМЯ ВЫШЛО");
                else nextQuestion();
            }
        }, duration);
    }

    function updateUI() {
        document.getElementById('tokens').innerText =tokens;
        document.getElementById('lives').innerText = lives;
        document.getElementById('progress').innerText = setProgress;
        document.querySelectorAll('.dot').forEach((d, i) => d.className = i < combo ? 'dot active' : 'dot');
    }

    function gameOver(txt) {
        clearInterval(timer);
        canClick = false;
        document.getElementById('grid').style.display = 'none';
        document.getElementById('bonus-grid').style.display = 'none';
        document.getElementById('question-box').innerText = txt;
        document.getElementById('start-btn').style.display = 'block';
    }

    function resetStyles() {
        document.querySelectorAll('.cell').forEach(c => c.classList.remove('correct', 'wrong'));
    }

    init();
</script>
</body>
</html>
