            comboDots.forEach((dot, index) => {

                    dot.classList.add('active');
                    const level = allQuestions[currentQuestionIndex - (setProgress - index)].t; // Get level of the dot's question
                    if (level === 9000) dot.classList.add('hard');

                } else {

        }

        function nextQuestion() {
            if (currentQuestionIndex >= allQuestions.length) {

            updateUI();

        }

            if (!canClick) return;

                window.tokens += (10 * window.multiplier);
