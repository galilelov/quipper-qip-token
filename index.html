<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QUIP PRO: Math Blitz</title>
    <style>
        :root { --primary: #e94560; --bg: #1a1a2e; --panel: #16213e; --text: #e9e9e9; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            /* Используем динамическую высоту, чтобы не перекрывалось навигацией */
            height: 100vh; height: 100dvh; 
            overflow: hidden; 
        }
        
        #game-container { 
            width: 100%; 
            max-width: 400px; 
            padding: 10px 15px; 
            /* Учет "безопасных зон" для смартфонов с вырезами и полосками */
            padding-bottom: env(safe-area-inset-bottom, 20px);
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; /* Равномерно распределяем элементы */
        }
        
        /* Компактная верхняя панель */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .stat-box { background: rgba(255,255,255,0.05); padding: 5px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); font-size: 14px; }
        .stat-box b { color: var(--primary); }
        
        .menu-btns { display: flex; gap: 8px; margin-bottom: 5px; }
        .menu-btns button { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--primary); background: transparent; color: white; cursor: pointer; font-size: 11px; text-transform: uppercase; }

        /* Question Area - уменьшили высоту для коротких экранов */
        #question-box { 
            flex: 1; 
            min-height: 80px;
            max-height: 120px;
            background: var(--panel); 
            border-radius: 15px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-size: 28px; 
            font-weight: bold; 
            margin: 10px 0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.05); 
            text-align: center; 
        }
        
        #timer-area { width: 100%; height: 4px; background: #333; border-radius: 2px; margin-bottom: 10px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--primary); transition: width linear; }

        /* Grid - ячейки теперь более компактные */
        #grid, #bonus-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .cell { 
            aspect-ratio: 1.2; 
            background: var(--panel); 
            border: none; 
            color: white; 
            font-size: 26px; 
            font-weight: bold; 
            border-radius: 12px; 
            box-shadow: 0 4px 0 #0f3460; 
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cell:active { transform: translateY(2px); box-shadow: 0 1px 0 #0f3460; background: var(--primary); }

        /* Кнопка Старт теперь не в самом низу, а в потоке элементов */
        #start-btn { 
            width: 100%; 
            padding: 18px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 15px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            display: none; 
            margin-top: 10px;
            box-shadow: 0 4px 0 #a02d40;
        }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .panel { width: 100%; max-width: 320px; background: var(--panel); padding: 20px; border-radius: 20px; text-align: center; border: 1px solid var(--primary); }
        .panel h2 { color: var(--primary); margin: 0 0 15px 0; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="top-bar">
        <div class="stat-box">💰 <b id="tokens-count">0</b> <small id="mult-label">x1</small></div>
        <div class="stat-box">❤️ <b id="lives-count">12</b></div>
    </div>

    <div class="menu-btns">
        <button onclick="showPanel('profile-panel')">👤 Profile</button>
        <button onclick="showPanel('shop-panel')">🛒 Shop</button>
    </div>

    <div id="question-box">LOADING...</div>
    <div id="timer-area"><div id="timer-bar"></div></div>

    <div id="grid">
        <button class="cell" onclick="handleMove(1)">1</button>
        <button class="cell" onclick="handleMove(2)">2</button>
        <button class="cell" onclick="handleMove(3)">3</button>
        <button class="cell" onclick="handleMove(4)">4</button>
        <button class="cell" onclick="handleMove(5)">5</button>
        <button class="cell" onclick="handleMove(6)">6</button>
        <button class="cell" onclick="handleMove(7)">7</button>
        <button class="cell" onclick="handleMove(8)">8</button>
        <button class="cell" onclick="handleMove(9)">9</button>
    </div>

    <div id="bonus-grid" style="display: none;">
        <button class="cell" onclick="handleBonus('<')">&lt;</button>
        <button class="cell" onclick="handleBonus('=')">=</button>
        <button class="cell" onclick="handleBonus('>')">&gt;</button>
    </div>

    <button id="start-btn" onclick="startNewSet()">START NEXT SET</button>
</div>

<!-- Оверлеи -->
<div id="profile-panel" class="overlay" onclick="closePanels()">
    <div class="panel" onclick="event.stopPropagation()">
        <h2>PROFILE</h2>
        <p style="font-size: 10px; opacity: 0.5; word-break: break-all;">ID: <span id="user-id-display">...</span></p>
        <p>Tokens: <b id="p-tokens">0</b></p>
        <button onclick="copyLink()" style="width:100%; padding:12px; border-radius:10px; background:#444; color:white; border:none; margin-bottom: 10px;">🔗 Copy Invite Link</button>
        <button onclick="closePanels()" style="width:100%; padding:10px; background:var(--primary); border:none; color:white; border-radius:10px;">CLOSE</button>
    </div>
</div>

<div id="shop-panel" class="overlay" onclick="closePanels()">
    <div class="panel" onclick="event.stopPropagation()">
        <h2>SHOP</h2>
        <button onclick="buyBoost(2, 2000)" style="width:100%; margin-bottom:10px; padding:10px;">Buy X2 (2000)</button>
        <button onclick="buyBoost(3, 10000)" style="width:100%; margin-bottom:10px; padding:10px;">Buy X3 (10k)</button>
        <button onclick="buyBoost(5, 50000)" style="width:100%; margin-bottom:10px; padding:10px;">Buy X5 (50k)</button>
        <button onclick="closePanels()" style="width:100%; padding:10px; background:#444; border:none; color:white; border-radius:10px; margin-top:10px;">CLOSE</button>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabaseUrl = 'https://gjfbsfkvyicvxqbzduud.supabase.co';
    const supabaseKey = 'sb_publishable_-GJ_CJ49ApNejRTZjVUmeA_ncSAUhyU'; 
    const supabase = createClient(supabaseUrl, supabaseKey);

    window.userId = null;
    window.tokens = 0;
    window.multiplier = 1;

    let allQuestions = [];
    let curQ = 0;
    let lives = 12;
    let setProgress = 0;
    let canClick = false;
    let timerId;
    let bonusAns = '';

    // Перемешивание массива (Алгоритм Фишера-Йейтса)
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    async function init() {
        const { data: { session } } = await supabase.auth.getSession();
        let user = session ? session.user : null;
        if (!user) { const { data } = await supabase.auth.signInAnonymously(); user = data.user; }

        window.userId = user.id;
        document.getElementById('user-id-display').innerText = user.id;

        await loadProfile();
        await loadQuestions();
    }

    async function loadProfile() {
        let { data: p } = await supabase.from('profiles').select('*').eq('id', window.userId).single();
        if (!p) {
            const { data } = await supabase.from('profiles').insert([{ id: window.userId, tokens: 0, multiplier: 1 }]).select().single();
            p = data;
        }
        window.tokens = p.tokens;
        window.multiplier = p.multiplier;
        updateUI();
    }

    async function loadQuestions() {
        const res = await fetch('questions.json?v=' + Date.now());
        allQuestions = await res.json();
        shuffle(allQuestions); // ПЕРЕМЕШИВАЕМ ВСЕ ВОПРОСЫ СРАЗУ
        document.getElementById('question-box').innerText = 'READY';
        document.getElementById('start-btn').style.display = 'block';
    }

    window.startNewSet = function() {
        setProgress = 0; 
        lives = 12;
        // Если вопросы закончились, перемешиваем заново и начинаем с нуля
        if (curQ >= allQuestions.length - 10) { shuffle(allQuestions); curQ = 0; }
        
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('grid').style.display = 'grid';
        document.getElementById('bonus-grid').style.display = 'none';
        nextQ();
    };

    function nextQ() {
        if (setProgress >= 9) return startBonus();
        canClick = false;
        const qData = allQuestions[curQ];
document.getElementById('question-box').innerText = qData.q;
        document.getElementById('question-box').style.color = 'white';
        startTimer(qData.t);
        setProgress++;
        setTimeout(() => { canClick = true; }, 100);
    }

    window.handleMove = function(num) {
        if (!canClick) return;
        canClick = false;
        clearTimeout(timerId);

        if (num === allQuestions[curQ].a) {
            window.tokens += (10 * window.multiplier);
            document.getElementById('question-box').style.color = '#4ade80';
            save();
            curQ++;
            setTimeout(nextQ, 400);
        } else {
            lives--;
            document.getElementById('question-box').style.color = '#ff4757';
            if (lives <= 0) { alert('GAME OVER'); location.reload(); }
            else { curQ++; setTimeout(nextQ, 400); }
        }
        updateUI();
    };

    function startBonus() {
        document.getElementById('grid').style.display = 'none';
        document.getElementById('bonus-grid').style.display = 'grid';
        // Случайные вопросы для сравнения из всей базы
        const qA = allQuestions[Math.floor(Math.random()*allQuestions.length)];
        const qB = allQuestions[Math.floor(Math.random()*allQuestions.length)];
        bonusAns = qA.a < qB.a ? '<' : (qA.a > qB.a ? '>' : '=');
        document.getElementById('question-box').innerHTML = '<div style="display:flex; gap:10px; align-items:center;">' + qA.q + ' <span style="color:var(--primary); font-size:40px;">?</span> ' + qB.q + '</div>';
        startTimer(7000);
        canClick = true;
    }

    window.handleBonus = function(sym) {
        if (!canClick) return;
        clearTimeout(timerId);
        if (sym === bonusAns) {
            window.tokens += (500 * window.multiplier);
            alert('BONUS WIN! +500');
            save();
            window.startNewSet();
        } else { alert('BONUS LOST'); window.startNewSet(); }
    };

    function startTimer(ms) {
        const bar = document.getElementById('timer-bar');
        bar.style.transition = 'none'; bar.style.width = '100%';
        setTimeout(() => {
            bar.style.transition = 'width ' + (ms/1000) + 's linear';
            bar.style.width = '0%';
        }, 50);
        timerId = setTimeout(() => { window.handleMove(-1); }, ms);
    }

    async function save() {
        await supabase.from('profiles').update({ tokens: window.tokens, multiplier: window.multiplier }).eq('id', window.userId);
    }

    function updateUI() {
        document.getElementById('tokens-count').innerText = window.tokens;
        document.getElementById('lives-count').innerText = lives;
        document.getElementById('mult-label').innerText = 'x' + window.multiplier;
        document.getElementById('p-tokens').innerText = window.tokens;
    }

    window.showPanel = function(id) { document.getElementById(id).style.display = 'flex'; };
    window.closePanels = function() { 
        document.getElementById('profile-panel').style.display = 'none';
        document.getElementById('shop-panel').style.display = 'none';
    };
    
    window.buyBoost = async function(m, cost) {
        if (window.tokens >= cost) {
            window.tokens -= cost; window.multiplier = m;
            await save(); updateUI(); alert('Activated X' + m);
        } else { alert('No tokens!'); }
    };

    window.copyLink = function() {
        const link = 'https://galilelov.github.io/quipper-qip-token/?ref=' + window.userId;
        navigator.clipboard.writeText(link);
        alert('Link Copied!');
    };

    init();
</script>
</body>
</html>
