<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QUIP Math Pro</title>
    <style>
        :root { --primary: #e94560; --bg: #0d1117; --panel: #161b22; --text: #e6edf3; --accent: #f1c40f; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; 
            display: flex; justify-content: center; height: 100dvh; overflow: hidden; 
        }

        #game-container { 
            width: 100%; max-width: 400px; height: 100%;
            padding: env(safe-area-inset-top, 10px) 15px env(safe-area-inset-bottom, 15px) 15px;
            display: flex; flex-direction: column;
        }

        .status-bar { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; }
        .stat-item { background: var(--panel); padding: 6px 12px; border-radius: 10px; border: 1px solid #30363d; font-size: 14px; }
        .stat-item b { color: var(--primary); }

        .menu-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .menu-row button { flex: 1; padding: 8px; background: transparent; border: 1px solid #30363d; color: #8b949e; border-radius: 8px; font-size: 11px; font-weight: bold; }

        #start-screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; }
        #big-start-btn { 
            width: 100%; padding: 25px; font-size: 22px; font-weight: 900; 
            background: var(--primary); color: white; border: none; border-radius: 15px;
            box-shadow: 0 6px 0 #a02d40; cursor: pointer;
        }
        #big-start-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #a02d40; }

        #play-screen { display: none; flex-direction: column; height: 100%; }
        
        #question-box { 
            height: 85px; background: var(--panel); border-radius: 15px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 28px; font-weight: bold; margin-bottom: 8px;
            border: 1px solid #30363d; text-align: center; overflow: hidden;
        }
        #timer-area { width: 100%; height: 5px; background: #21262d; border-radius: 3px; margin-bottom: 15px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--primary); }

        #grid, #bonus-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: auto; padding-bottom: 10px; }
        
        .cell { 
            aspect-ratio: 1.3; background: var(--panel); border: 1px solid #30363d; color: white; 
            font-size: 28px; font-weight: bold; border-radius: 12px; 
            box-shadow: 0 4px 0 #000; display: flex; align-items: center; justify-content: center;
        }
        .cell:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; background: var(--primary); border-color: var(--primary); }

        .q-mark { color: var(--accent); font-size: 38px; margin: 0 10px; animation: pulse 0.8s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .panel { background: var(--panel); width: 85%; padding: 20px; border-radius: 15px; border: 1px solid #30363d; text-align: center; }
        .panel button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="game-container">
    <div class="status-bar">
        <div class="stat-item">💰 <span id="t-count">0</span> <small id="m-label">x1</small></div>
        <div class="stat-item">❤️ <span id="l-count">12</span></div>
    </div>

    <div class="menu-row">
        <button onclick="openPanel('profile')">PROFILE</button>
        <button onclick="openPanel('shop')">SHOP</button>
    </div>

    <div id="start-screen">
        <h1 style="color:var(--primary); margin:0; font-size: 42px; letter-spacing: 2px;">QUIP</h1>
        <button id="big-start-btn" onclick="startFullGame()">START GAME</button>
    </div>

    <div id="play-screen">
        <div id="question-box">...</div>
        <div id="timer-area"><div id="timer-bar"></div></div>
        
        <div id="grid">
            <button class="cell" onclick="handleInput(1)">1</button>
            <button class="cell" onclick="handleInput(2)">2</button>
            <button class="cell" onclick="handleInput(3)">3</button>
            <button class="cell" onclick="handleInput(4)">4</button>
            <button class="cell" onclick="handleInput(5)">5</button>
            <button class="cell" onclick="handleInput(6)">6</button>
            <button class="cell" onclick="handleInput(7)">7</button>
            <button class="cell" onclick="handleInput(8)">8</button>
            <button class="cell" onclick="handleInput(9)">9</button>
        </div>

        <div id="bonus-grid" style="display:none;">
            <button class="cell" onclick="handleBonus('<')">&lt;</button>
            <button class="cell" onclick="handleBonus('=')">=</button>
            <button class="cell" onclick="handleBonus('>')">&gt;</button>
        </div>
    </div>
</div>

<div id="overlay-bg" class="overlay" onclick="closePanels()">
    <div class="panel" id="profile-panel" onclick="event.stopPropagation()" style="display:none;">
        <h3>USER PROFILE</h3>
        <p style="font-size:10px; color:#8b949e; word-break:break-all;" id="u-id">ID: ...</p>
        <button onclick="copyLink()" style="background:#21262d; color:white;">COPY INVITE LINK</button>
    </div>
    <div class="panel" id="shop-panel" onclick="event.stopPropagation()" style=
"display:none;">
        <h3>BOOST SHOP</h3>
        <button onclick="buy(2, 50000)" style="background:#238636; color:white;">X2 Boost (50k)</button>
        <button onclick="buy(3, 200000)" style="background:#238636; color:white;">X3 Boost (200k)</button>
        <button onclick="buy(4, 600000)" style="background:#238636; color:white;">X4 Boost (600k)</button>
        <button onclick="buy(5, 1000000)" style="background:#238636; color:white;">X5 Boost (1M)</button>
    </div>
</div>

<script type="module">
  // корректный ESM-бандл
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.34.0';

  // Публичный ключ (anon/publishable). НЕ храните service_role в клиенте!
  const supabaseUrl = 'https://gjfbsfkvyicvxqbzduud.supabase.co';
  const supabaseKey = 'sb_publishable_-GJ_CJ49ApNejRTZjVUmeA_ncSAUhyU';

  // Создаём клиента и делаем его глобальным
  const supabase = createClient(supabaseUrl, supabaseKey);
  window.supabase = supabase;

  // Переменные приложения (по желанию можно тоже сделать глобальными)
  let userId, tokens = 0, multiplier = 1;
  let questions = [], queue = [], curAns, timer, canClick = false;
  let lives = 12, setCounter = 0, bonusAns = '';

  function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
  }

    // --- НОВАЯ ФУНКЦИЯ: handleReferralLink ---
                async function handleReferralLink() {
        const urlParams = new URLSearchParams(window.location.search);
        const referrerId = urlParams.get('ref'); // ID того, кто пригласил
        const currentUserId = userId; // ID текущего пользователя (того, кто пришел по ссылке)

        console.log(`handleReferralLink check: referrerId=${referrerId}, currentUserId=${currentUserId}`);

        // Условия для выполнения:
        // 1. Оба ID должны быть получены
        // 2. ID приглашающего и приглашенного не должны совпадать (чтобы не приглашать самого себя)
        if (referrerId && currentUserId && referrerId !== currentUserId) {
            
            alert(`Обнаружена реферальная ссылка! Пытаюсь начислить бонус.\nПриглашающий: ${referrerId}\nПриглашенный: ${currentUserId}`);

            try {
                // ВЫЗЫВАЕМ ФУНКЦИЮ БАЗЫ ДАННЫХ (RPC)
                // Параметры должны ТОЧНО совпадать с теми, что ожидает SQL-функция (referrer_uuid, referred_uuid)
                const { data, error } = await supabase.rpc('award_referral_bonus', {
                    referrer_uuid: referrerId,
                    referred_uuid: currentUserId
                });

                if (error) {
                    alert("Ошибка при вызове базы данных: " + error.message);
                    console.error("RPC Error:", error.message);
                } else if (data) {
                    console.log("RPC Result:", data);
                    if (data.success) {
                        alert("Бонус успешно начислен!");
                        // Обновляем данные на экране, чтобы игрок увидел изменения
                        await fetchProfileDataAndRefreshUI(); 
                    } else {
                        // Если data.success = false, выводим сообщение от SQL-функции
                        alert("Результат: " + data.message);
                    }
                } else {
                    // Если data пустой, а ошибки нет (маловероятно, но для надежности)
                    alert("Неожиданный результат от базы данных. Проверьте логи.");
                    console.error("Unexpected RPC result: data is empty, no error.");
                }
            } catch (callError) {
                // Обработка ошибок, которые могут возникнуть до получения ответа от базы
                alert("Критическая ошибка при вызове базы: " + callError.message);
                console.error("Critical error during RPC call:", callError.message);
            }
        } else {
            // Сообщения, если условия не выполнены
            if (!referrerId) console.log("handleReferralLink skipped: referrer ID is missing.");
            if (!currentUserId) console.log("handleReferralLink skipped: current user ID is missing.");
            if (referrerId === currentUserId) console.log("handleReferralLink ignored: self-referral.");
        }
    }

    // --- КОНЕЦ handleReferralLink ---

    // Функция для получения и обновления данных профиля (может быть полезна после рефералки)
    async function fetchProfileDataAndRefreshUI() {
        const { data: p, error } = await supabase.from('profiles').select('*').eq('id', userId).single();
        if (error) {
            console.error("Error fetching profile after referral:", error);
            // Можно просто перезагрузить страницу или показать ошибку
        } else if (p) {
            tokens = p.tokens;
            multiplier = p.multiplier;
            updateUI();
        }
    }


            async function init() {
        try {
            const qRes = await fetch('questions.json?v=' + Date.now());
            if (!qRes.ok) throw new Error("questions.json not found");
            questions = await qRes.json();
            console.log("Questions loaded.");

            const { data: { session } } = await supabase.auth.getSession();
            let user = session ? session.user : (await supabase.auth.signInAnonymously()).data.user;
            userId = user.id;
            document.getElementById('u-id').innerText = "ID: " + userId;
            console.log("User ID:", userId);

            // ПРОВЕРЯЕМ ИЛИ СОЗДАЕМ ПРОФИЛЬ
            const { data: p, error: pError } = await supabase
                .from('profiles')
                .select('tokens, multiplier, invited_by') // Важно: SELECT invited_by
                .eq('id', userId)
                .single();

            if (pError && pError.code !== 'PGRST116') { 
                console.error("Profile fetch error:", pError.message);
            }

            if (p) { 
                tokens = p.tokens; 
                multiplier = p.multiplier; 
                console.log(`Profile loaded. Tokens: ${tokens}, Multiplier: ${multiplier}, Invited by: ${p.invited_by}`);
                // Если профиль уже существует и у него уже есть invited_by, мы ничего не делаем с рефералкой.
                // Но если invited_by пустой, мы можем попробовать её вызвать.
                if (!p.invited_by) {
                    console.log("Profile exists, but not invited. Scheduling referral check...");
                    setTimeout(async () => {
                        await handleReferralLink();
                    }, 3000);
                } else {
                    console.log("Profile exists and already invited. Skipping referral check.");
                }
            } else { 
                console.log("Profile not found, creating new profile...");
                await supabase.from('profiles').insert([
                    { id: userId, tokens: 0, multiplier: 1, invited_by: null, referred_by: null, referrals_count: 0 } // Явно устанавливаем null
                ]); 
                tokens = 0;
                multiplier = 1;
                console.log("New profile created. Tokens: 0, Multiplier: 1, Invited by: null, Referred by: null");
                
                // !!! ВАЖНО: Здесь мы ПОЧТИ сразу пытаемся вызвать реферал, но с задержкой !!!
                console.log("Scheduling referral check after profile creation...");
                setTimeout(async () => {
                    await handleReferralLink();
                }, 100); // Задержка 0,1 секунды
            }
            
            updateUI(); 

        } catch (error) {
            console.error("CRITICAL ERROR DURING INIT:", error);
        }
    }



    // --- ГЛОБАЛЬНЫЕ ФУНКЦИИ (доступные из HTML) ---
    window.startFullGame = function() {
        if (questions.length === 0) {
            alert("Questions are still loading or failed to load. Please refresh.");
            return;
        }
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('play-screen').style.display = 'flex';
        startNewSet();
    };

    function startNewSet() {
        setCounter = 0; lives = 12;
        if (queue.length < 15) queue = shuffle([...questions]);
        document.getElementById('grid').style.display = 'grid';
        document.getElementById('bonus-grid').style.display = 'none';
        nextQuestion();
    }

    function nextQuestion() {
        if (setCounter >= 9) return startBonus();
        canClick = false;
        const qData = queue.shift();
        curAns = qData.a;
        const box = document.getElementById('question-box');
        box.innerText = qData.q;
        box.style.color = 'white';
        startTimer(qData.t);
        setCounter++;
        updateUI();
        setTimeout(() => canClick = true, 100);
    }

    window.handleInput = function(n) {
        if (!canClick) return;
        canClick = false;
        clearTimeout(timer);

        if (n === curAns) {
            tokens += (5 * multiplier);
            document.getElementById('question-box').style.color = '#4ade80';
            save();
            setTimeout(nextQuestion, 400);
        } else {
            tokens = Math.max(0, tokens - 1);
            lives--;
            document.getElementById('question-box').style.color = '#ff4757';
            if (lives <= 0) { alert("GAME OVER!"); location.reload(); }
            else { setTimeout(nextQuestion, 400); }
        }
        updateUI();
    };

    function startTimer(ms) {
        const bar = document.getElementById('timer-bar');
        bar.style.transition = 'none'; bar.style.width = '100%';
        setTimeout(() => {
            bar.style.transition = `width ${ms/1000}s linear`;
            bar.style.width = '0%';
        }, 50);
        timer = setTimeout(() => window.handleInput(-1), ms); // Вызов через window
    }

    function startBonus() {
        document.getElementById('grid').style.display = 'none';
        document.getElementById('bonus-grid').style.display = 'grid';
        
        const shortQ = questions.filter(q => q.q.length <= 7);
        const source = shortQ.length > 5 ? shortQ : questions;
        
        const qA = source[Math.floor(Math.random()*source.length)];
        const qB = source[Math.floor(Math.random()*source.length)];
        
        bonusAns = qA.a < qB.a ? '<' : (qA.a > qB.a ? '>' : '=');
        
        document.getElementById('question-box').innerHTML = 
            `<span>${qA.q}</span><span class="q-mark">?</span><span>${qB.q}</span>`;
        
        startTimer(7000);
        canClick = true;
    }

    window.handleBonus = function(s) {
        if (!canClick) return;
        clearTimeout(timer);
        if (s === bonusAns) {
            tokens += (500 * multiplier);
            alert("BONUS WIN! +500");
            save();
            startNewSet();
        } else {
            tokens = Math.max(0, tokens - 1);
            alert("BONUS LOST!");
            startNewSet();
        }
        updateUI();
    };

    async function save() {
        await supabase.from('profiles').update({ tokens, multiplier }).eq('id', userId);
    }

    function updateUI() {
        document.getElementById('t-count').innerText = tokens;
        document.getElementById('l-count').innerText = lives;
        document.getElementById('m-label').innerText = 'x' + multiplier;
    }

    window.openPanel = (p) => {
        document.getElementById('overlay-bg').style.display = 'flex';
        document.getElementById(p + '-panel').style.display = 'block';
    };
    window.closePanels = () => {
        document.getElementById('overlay-bg').style.display = 'none';
        document.getElementById('profile-panel').style.display = 'none';
        document.getElementById('shop-panel').style.display = 'none';
    };
    window.buy = async (m, cost) => {
        if (tokens >= cost) {
            tokens -= cost; multiplier = m;
            await save(); updateUI(); alert("Multiplier X" + m + " active!");
        } else alert("Need more tokens!");
    };
    window.copyLink = () => {
        navigator.clipboard.writeText('https://galilelov.github.io/quipper-qip-token/?ref=' + userId);
        alert("Link copied!");
    };

    init();
</script>
</body>
</html>
