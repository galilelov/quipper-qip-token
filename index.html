<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIP: QIP Token Game</title>
    <style>
        body { font-family: sans-serif; background: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; flex-direction: column; }
        #game-container { background: #161b22; border-radius: 12px; padding: 20px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #30363d; }
        #status-bar { display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 18px; }
        #question-box { background: #21262d; border-radius: 8px; padding: 20px; margin-bottom: 20px; font-size: 28px; font-weight: bold; min-height: 60px; display: flex; align-items: center; justify-content: center; border: 1px solid #30363d; }
        #timer-area { background: #30363d; height: 8px; border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: #238636; transition: width linear; }
        #grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .cell { background: #21262d; border: 1px solid #30363d; border-radius: 8px; padding: 20px 0; font-size: 24px; color: #fff; cursor: pointer; }
        #start-btn { background: #238636; color: white; border: none; border-radius: 8px; padding: 15px; font-size: 18px; width: 100%; cursor: pointer; display: none; }
        .bonus-grid { display: none; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="status-bar">
        <span>💰 <b id="tokens-count">0</b></span>
        <span>❤️ <b id="lives-count">12</b></span>
    </div>
    
    <div id="question-box">LOADING...</div>
    <div id="timer-area"><div id="timer-bar"></div></div>

    <div id="grid">
        <button class="cell" onclick="makeMove(1)">1</button>
        <button class="cell" onclick="makeMove(2)">2</button>
        <button class="cell" onclick="makeMove(3)">3</button>
        <button class="cell" onclick="makeMove(4)">4</button>
        <button class="cell" onclick="makeMove(5)">5</button>
        <button class="cell" onclick="makeMove(6)">6</button>
        <button class="cell" onclick="makeMove(7)">7</button>
        <button class="cell" onclick="makeMove(8)">8</button>
        <button class="cell" onclick="makeMove(9)">9</button>
    </div>

    <div id="bonus-grid" class="bonus-grid">
        <button class="cell" onclick="makeBonusMove('<')">&lt;</button>
        <button class="cell" onclick="makeBonusMove('=')">=</button>
        <button class="cell" onclick="makeBonusMove('>')">&gt;</button>
    </div>

    <button id="start-btn" onclick="startNewSet()">START SET</button>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabaseUrl = 'https://gjfbsfkvyicvxqbzduud.supabase.co';
    // ВНИМАНИЕ: Проверьте, чтобы в ключе не было лишних пробелов или знаков \
    const supabaseKey = 'sb_publishable_-GJ_CJ49ApNejRTZjVUmeA_ncSAUhyU'; 
    const supabase = createClient(supabaseUrl, supabaseKey);

    window.userId = null;
    window.tokens = 0;
    window.multiplier = 1;

    let allQuestions = [];
    let currentQuestionIndex = 0;
    let currentAnswer = 0;
    let lives = 12;
    let setProgress = 0;
    let canClick = false;
    let timerId;
    let bonusAnswer = '';

    async function startApp() {
        try {
            const { data: { session } } = await supabase.auth.getSession();
            let user = session ? session.user : null;

            if (!user) {
                const { data, error } = await supabase.auth.signInAnonymously();
                if (error) throw error;
                user = data.user;
            }

            window.userId = user.id;
            await loadUserData();
            await loadQuestions();
        } catch (err) {
            console.error(err);
            document.getElementById('question-box').innerText = 'AUTH ERROR';
        }
    }

    async function loadUserData() {
        let { data: profile } = await supabase.from('profiles').select('*').eq('id', window.userId).single();
        
        if (!profile) {
            const { data } = await supabase.from('profiles').insert([{ id: window.userId, tokens: 0, multiplier: 1 }]).select().single();
            profile = data;
        }

        if (profile) {
            window.tokens = profile.tokens;
            window.multiplier = profile.multiplier;
            updateUI();
        }
    }

    async function loadQuestions() {
        const res = await fetch('questions.json?v=' + Date.now());
        allQuestions = await res.json();
        document.getElementById('question-box').innerText = 'READY';
        document.getElementById('start-btn').style.display = 'block';
    }

    window.startNewSet = function() {
        setProgress = 0;
        lives = 12;
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('grid').style.display = 'grid';
        document.getElementById('bonus-grid').style.display = 'none';
        updateUI();
        nextQuestion();
    };

    function nextQuestion() {
        if (setProgress >= 9) {
            startBonus();
            return;
        }
        const qData = allQuestions[currentQuestionIndex];
        currentAnswer = qData.a;
        document.getElementById('question-box').innerText = qData.q;
        document.getElementById('question-box').style.color = '#fff';
        
        startTimer(qData.t);
        setProgress++;
        canClick = true;
    }

    window.makeMove = function(num) {
        if (!canClick) return;
        canClick = false;
        clearTimeout(timerId);

        if (num === currentAnswer) {
            window.tokens += (10 * window.multiplier);
            document.getElementById('question-box').style.color = '#2ecc71';
            updateUI();
            saveToDb();
            currentQuestionIndex++;
            setTimeout(nextQuestion, 500);
        } else {
            lives--;
            document.getElementById('question-box').style.color = '#e74c3c';
            updateUI();
            if (lives <= 0) {
                alert('GAME OVER');
                location.reload();
            } else {
                currentQuestionIndex++;
                setTimeout(nextQuestion, 500);
            }
        }
    };

    function startTimer(ms) {
        const bar = document.getElementById('timer-bar');
        bar.style.transition = 'none';
        bar.style.width = '100%';
        setTimeout(() => {
            bar.style.transition = 'width ' + (ms/1000) + 's linear';
            bar.style.width = '0%';
        }, 10);
        timerId = setTimeout(() => {
            window.makeMove(-1);
        }, ms);
    }

    async function saveToDb() {
        await supabase.from('profiles').update({ tokens: window.tokens }).eq('id', window.userId);
    }

    function updateUI() {
        document.getElementById('tokens-count').innerText = window.tokens;
        document.getElementById('lives-count').innerText = lives;
    }

    function startBonus() {
        document.getElementById('grid').style.display = 'none';
        document.getElementById('bonus-grid').style.display = 'grid';
        document.getElementById('question-box').innerText = 'BONUS: ?';
    }

    window.makeBonusMove = function(s) {
        alert('Bonus step clicked: ' + s);
        window.startNewSet();
    };

    startApp();
</script>

</body>
</html>
