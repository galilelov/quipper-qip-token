<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>QUIP Math Pro</title>
    <style>
        :root { --primary: #e94560; --bg: #1a1a2e; --panel: #16213e; --text: #e9e9e9; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: manipulation; }
        
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); color: var(--text); margin: 0; 
            display: flex; justify-content: center; height: 100dvh; overflow: hidden; 
        }

        #game-container { 
            width: 100%; max-width: 400px; height: 100%;
            padding: env(safe-area-inset-top, 10px) 15px env(safe-area-inset-bottom, 20px) 15px;
            display: flex; flex-direction: column;
        }

        /* Статус бар сверху */
        .status-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; }
        .stat-item { background: var(--panel); padding: 8px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); }
        .stat-item b { color: var(--primary); }

        /* Экран запуска (видны только при входе) */
        #start-screen { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        }
        #big-start-btn { 
            width: 100%; padding: 30px; font-size: 24px; font-weight: 900; 
            background: var(--primary); color: white; border: none; border-radius: 20px;
            box-shadow: 0 8px 0 #a02d40; cursor: pointer; text-transform: uppercase;
        }
        #big-start-btn:active { transform: translateY(4px); box-shadow: 0 4px 0 #a02d40; }

        /* Игровой экран (скрыт изначально) */
        #play-screen { display: none; flex-direction: column; height: 100%; }
        
        #question-box { 
            height: 120px; background: var(--panel); border-radius: 20px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 34px; font-weight: bold; margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.1); text-align: center;
        }

        #timer-area { width: 100%; height: 6px; background: #333; border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: var(--primary); }

        #grid, #bonus-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: auto; padding-bottom: 20px;}
        
        .cell { 
            aspect-ratio: 1.2; background: var(--panel); border: none; color: white; 
            font-size: 32px; font-weight: bold; border-radius: 15px; 
            box-shadow: 0 5px 0 #0f3460; display: flex; align-items: center; justify-content: center;
        }
        .cell:active { transform: translateY(3px); box-shadow: 0 2px 0 #0f3460; background: var(--primary); }

        /* Меню и оверлеи */
        .menu-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .menu-row button { flex: 1; padding: 10px; background: transparent; border: 1px solid var(--primary); color: white; border-radius: 10px; font-size: 12px; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .panel { background: var(--panel); width: 85%; padding: 25px; border-radius: 20px; border: 1px solid var(--primary); text-align: center; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Шапка всегда сверху -->
    <div class="status-bar">
        <div class="stat-item">💰 <span id="t-count">0</span> <small id="m-label">x1</small></div>
        <div class="stat-item">❤️ <span id="l-count">12</span></div>
    </div>

    <div class="menu-row">
        <button onclick="openPanel('profile')">PROFILE</button>
        <button onclick="openPanel('shop')">SHOP</button>
    </div>

    <!-- Начальный экран -->
    <div id="start-screen">
        <div style="text-align: center; margin-bottom: 20px;">
            <h1 style="color:var(--primary); margin:0; font-size: 40px;">QUIP</h1>
            <p style="opacity:0.6;">Math Blitz Challenge</p>
        </div>
        <button id="big-start-btn" onclick="startFullGame()">START GAME</button>
    </div>

    <!-- Игровой экран -->
    <div id="play-screen">
        <div id="question-box">...</div>
        <div id="timer-area"><div id="timer-bar"></div></div>
        
        <div id="grid">
            <button class="cell" onclick="handleInput(1)">1</button>
            <button class="cell" onclick="handleInput(2)">2</button>
            <button class="cell" onclick="handleInput(3)">3</button>
            <button class="cell" onclick="handleInput(4)">4</button>
            <button class="cell" onclick="handleInput(5)">5</button>
            <button class="cell" onclick="handleInput(6)">6</button>
            <button class="cell" onclick="handleInput(7)">7</button>
            <button class="cell" onclick="handleInput(8)">8</button>
            <button class="cell" onclick="handleInput(9)">9</button>
        </div>

        <div id="bonus-grid" style="display:none;">
            <button class="cell" onclick="handleBonus('<')">&lt;</button>
            <button class="cell" onclick="handleBonus('=')">=</button>
            <button class="cell" onclick="handleBonus('>')">&gt;</button>
        </div>
    </div>
</div>

<!-- Оверлеи (Профиль и Магазин) -->
<div id="overlay-bg" class="overlay" onclick="closePanels()">
    <div class="panel" id="profile-panel" onclick="event.stopPropagation()" style="display:none;">
        <h2>PROFILE</h2>
        <p style="font-size:11px; opacity:0.5; word-break:break-all;" id="u-id">ID: ...</p>
        <button onclick="copyLink()" style="width:100%; padding:15px; background:#444; color:white; border:none; border-radius:10px;">COPY INVITE LINK</button>
    </div>
<div class="panel" id="shop-panel" onclick="event.stopPropagation()" style="display:none;">
        <h2>SHOP</h2>
        <button onclick="buy(2, 2000)" style="width:100%; padding:12px; margin-bottom:10px;">X2 Multiplier (2000)</button>
        <button onclick="buy(3, 10000)" style="width:100%; padding:12px; margin-bottom:10px;">X3 Multiplier (10k)</button>
        <button onclick="buy(5, 50000)" style="width:100%; padding:12px;">X5 Multiplier (50k)</button>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabaseUrl = 'https://gjfbsfkvyicvxqbzduud.supabase.co';
    const supabaseKey = 'sb_publishable_-GJ_CJ49ApNejRTZjVUmeA_ncSAUhyU'; 
    const supabase = createClient(supabaseUrl, supabaseKey);

    // Глобальные переменные
    let userId, tokens = 0, multiplier = 1;
    let questions = [], queue = [], curAns, timer, canClick = false;
    let lives = 12, setCounter = 0, bonusAns = '';

    // Перемешивание
    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // Загрузка
    async function init() {
        const { data: { session } } = await supabase.auth.getSession();
        let user = session ? session.user : (await supabase.auth.signInAnonymously()).data.user;
        userId = user.id;
        document.getElementById('u-id').innerText = "ID: " + userId;

        const { data: p } = await supabase.from('profiles').select('*').eq('id', userId).single();
        if (p) {
            tokens = p.tokens;
            multiplier = p.multiplier;
        } else {
            await supabase.from('profiles').insert([{ id: userId, tokens: 0, multiplier: 1 }]);
        }
        
        const qRes = await fetch('questions.json?v=' + Date.now());
        questions = await qRes.json();
        
        updateUI();
    }

    // Запуск игры
    window.startFullGame = function() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('play-screen').style.display = 'flex';
        startNewSet();
    };

    function startNewSet() {
        setCounter = 0;
        lives = 12;
        // Обновляем очередь, если она пуста
        if (queue.length < 10) queue = shuffle([...questions]);
        
        document.getElementById('grid').style.display = 'grid';
        document.getElementById('bonus-grid').style.display = 'none';
        nextQuestion();
    }

    function nextQuestion() {
        if (setCounter >= 9) return startBonus();
        
        canClick = false;
        const qData = queue.shift();
        curAns = qData.a;
        
        const box = document.getElementById('question-box');
        box.innerText = qData.q;
        box.style.color = 'white';
        
        startTimer(qData.t);
        setCounter++;
        updateUI();
        setTimeout(() => canClick = true, 100);
    }

    window.handleInput = function(n) {
        if (!canClick) return;
        canClick = false;
        clearTimeout(timer);

        if (n === curAns) {
            tokens += (10 * multiplier);
            document.getElementById('question-box').style.color = '#4ade80';
            save();
            setTimeout(nextQuestion, 400);
        } else {
            lives--;
            document.getElementById('question-box').style.color = '#ff4757';
            if (lives <= 0) {
                alert("GAME OVER! Tokens: " + tokens);
                location.reload();
            } else {
                setTimeout(nextQuestion, 400);
            }
        }
        updateUI();
    };

    function startTimer(ms) {
        const bar = document.getElementById('timer-bar');
        bar.style.transition = 'none'; bar.style.width = '100%';
        setTimeout(() => {
            bar.style.transition = `width ${ms/1000}s linear`;
            bar.style.width = '0%';
        }, 50);
        timer = setTimeout(() => handleInput(-1), ms);
    }

    function startBonus() {
        document.getElementById('grid').style.display = 'none';
        document.getElementById('bonus-grid').style.display = 'grid';
        const qA = questions[Math.floor(Math.random()*questions.length)];
        const qB = questions[Math.floor(Math.random()*questions.length)];
        bonusAns = qA.a < qB.a ? '<' : (qA.a > qB.a ? '>' : '=');
        document.getElementById('question-box').innerHTML = `${qA.q} <span style="color:var(--primary); font-size:40px;">?</span> ${qB.q}`;
        startTimer(7000);
        canClick = true;
    }

    window.handleBonus = function(s) {
        if (!canClick) return;
        clearTimeout(timer);
        if (s === bonusAns) {
            tokens += (500 * multiplier);
            alert("BONUS WIN! +500");
            save();
            startNewSet();
        } else {
            alert("BONUS LOST");
            startNewSet();
        }
    };

    async function save() {
        await supabase.from('profiles').update({ tokens, multiplier }).eq('id', userId);
    }

    function updateUI() {
        document.getElementById('t-count').innerText = tokens;
        document.getElementById('l-count').innerText = lives;
        document.getElementById('m-label').innerText = 'x' + multiplier;
    }

    // Панели
    window.openPanel = (p) => {
        document.getElementById('overlay-bg').style.display = 'flex';
        document.getElementById(p + '-panel').style.display = 'block';
    };
    window.closePanels = () => {
        document.getElementById('overlay-bg').style.display = 'none';
        document.getElementById('profile-panel').style.display = 'none';
        document.getElementById('shop-panel').style.display = 'none';
    };
    window.buy = async (m, cost) => {
        if (tokens >= cost) {
            tokens -= cost; multiplier = m;
            await save(); updateUI(); alert("Success!");
        } else alert("No tokens");
    };
    window.copyLink = () => {
        navigator.clipboard.writeText('https://galilelov.github.io/quipper-qip-token/?ref=' + userId);
        alert("Link copied!");
    };

    init();
</script>
</body>
</html>
